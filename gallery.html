    </head>
    <body>
        <header>
            <div class="top-bar">
                <div class="inner-bar">
                    <div class="logo">
                        <img src="assets/logo-y.jpg" alt="LyanLab" />
                    </div>

                    <nav class="main-nav">
                        <a href="index.html" class="active">Home</a>

                        <a href="ndmind.html">NDMind</a>
                        <a href="etherealrealm.html">EtherealRealm</a>
                    </nav>

                    <div class="social-links">
                        <a
                            href="https://x.com/LyanLab"
                            target="_blank"
                            rel="noopener"
                            >𝕏</a
                        >
                        <a
                            href="https://linkedin.com/in/YOUR-LINKEDIN-USERNAME"
                            target="_blank"
                            rel="noopener"
                            >in</a
                        >
                    </div>

                    <!-- Mobile only -->
                    <input
                        type="checkbox"
                        id="menu-toggle"
                        class="menu-toggle"
                    />
                    <label for="menu-toggle" class="hamburger">☰</label>

                    <nav class="mobile-nav">
                        <a href="index.html" class="active">Home</a>
                        <a href="bio.html">Bio</a>
                        <a href="mentoring.html">Mentoring</a>

                        <a href="ndmind.html">NDMind</a>
                        <a href="etherealrealm.html">EtherealRealm</a>

                        <div class="mobile-social">
                            <a href="https://x.com/LyanLab" target="_blank"
                                >𝕏</a
                            >
                            <a
                                href="https://linkedin.com/in/YOUR-LINKEDIN-USERNAME"
                                target="_blank"
                                >in</a
                            >
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <main>
            <!-- Pinned hero (replace src with your _pin file or remove the whole block) -->
            <div class="pinned-hero">
                <img
                    src="assets/gallery/your-art-pin.jpg"
                    alt="Featured Work"
                />
                <!-- Or for video: <video src="assets/gallery/your-clip-pin.mp4" poster="assets/gallery/your-art-pin.jpg" autoplay muted loop></video> -->
            </div>

            <h2 style="margin-bottom: 32px; text-align: center">
                Selected Works
            </h2>
            <div id="gallery-grid" class="gallery-grid">
                <!-- Add your 12 pieces here — example: -->
                <!-- <img src="assets/gallery/art-01.jpg" alt=""> -->
                <!-- <video src="assets/gallery/clip-02.mp4" poster="assets/gallery/art-02.jpg" muted loop></video> -->
            </div>
        </main>

        <footer>
            © 2026 LyanLab • Built with curiosity and a little help from the
            stars
        </footer>

        <script src="js/main.js"></script>
